name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y cmake g++ git libx11-dev libxi-dev libvulkan-dev zsh
      # No Raven checkout step: CMake downloads Raven at the pinned commit itself, so CI cannot be broken by
      # a moving branch. Raven is not in AUR or Nix, so this fallback is the supported way.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOLIBRY_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test (headless)
        run: ctest --test-dir build --output-on-failure
      - name: Install into a staging prefix
        run: cmake --install build --prefix "$PWD/stage" && find stage -type f
